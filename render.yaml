services:
  - type: web
    name: fraudlens-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: FraudLens
      - key: APP_VERSION
        value: 1.0.0
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALLOWED_ORIGINS
        value: https://fraudlens.onrender.com,http://localhost:5173

  - type: web
    name: fraudlens
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://fraudlens-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
